<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MOMO — Wajah & Kontrol Suara</title>
<style>
  :root{
    --bg:#05070a; --panel:#0d1218; --line:#1b232c;
    --eye:#7fe7ff; --eye-glow:#7fe7ffaa; --accent:#ff9f6b;
    --ok:#6bffa0; --warn:#ffcf6b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: radial-gradient(120% 120% at 50% 20%, #10161d 0%, var(--bg) 60%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none; color:#cfe3ee;
  }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; }

  /* ---- Bar atas ---- */
  #topbar{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px; color:#4c5b68; font-size:12px; letter-spacing:.3px;
    pointer-events:none; z-index:5;
  }
  #topbar span.dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:middle; }
  #topbar span.dot.bt-on{ background:var(--ok); box-shadow:0 0 6px var(--ok); }

  /* ---- Badge perintah (muncul sesaat saat perintah dikenali) ---- */
  #cmdBadge{
    position:fixed; top:54px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:rgba(13,18,24,0.9); border:1px solid rgba(127,231,255,0.3);
    padding:8px 16px; border-radius:20px; font-size:13px; color:var(--eye);
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:6;
  }
  #cmdBadge.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #cmdBadge.warn{ color:var(--warn); border-color:rgba(255,207,107,0.35); }

  /* ---- Hint bawah ---- */
  #hint{
    position:fixed; bottom:96px; left:0; right:0; text-align:center;
    color:#3a4650; font-size:11px; pointer-events:none; z-index:4;
  }

  /* ---- Kontrol bawah kanan ---- */
  #controls{
    position:fixed; bottom:20px; right:16px; display:flex; flex-direction:column; gap:10px; z-index:30;
  }
  .ctrlBtn{
    width:48px; height:48px; border-radius:50%; background:var(--panel);
    border:1px solid var(--line); color:var(--eye); font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .ctrlBtn.on{ box-shadow:0 0 0 6px rgba(127,231,255,0.12); color:#fff; border-color:rgba(127,231,255,0.4); }
  .ctrlBtn.bt.on{ box-shadow:0 0 0 6px rgba(107,255,160,0.12); color:var(--ok); border-color:rgba(107,255,160,0.4); }

  /* ---- Panel geser (transkrip, riwayat, kata kunci) ---- */
  #panel{
    position:fixed; left:0; right:0; bottom:0;
    background:#0a0e13; border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    transform:translateY(100%); transition:transform .28s ease;
    max-height:72vh; overflow-y:auto; padding:14px 16px 26px; z-index:20;
  }
  #panel.open{ transform:translateY(0); }
  #panelHandle{ width:36px; height:4px; background:#243040; border-radius:3px; margin:0 auto 14px; }

  #transcriptBox{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; min-height:44px; font-size:14px; color:#e8f4fa; margin-bottom:12px;
  }
  #transcriptBox .placeholder{ color:#3a4650; font-size:12px; }

  label.wake{ display:flex; align-items:center; gap:8px; font-size:12px; color:#9db2c2; padding:2px 2px 14px; }

  h2.section{ font-size:11px; color:#4c5b68; margin:14px 0 8px; font-weight:600; }

  .kwGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px; }
  .kwCard{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .kwCard .k{ font-size:10px; color:#4c5b68; }
  .kwCard .v{ font-size:12px; color:#cfe3ee; margin-top:1px; }
  .kwCard .v b{ color:var(--eye); }

  #log{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 2px; max-height:150px; overflow-y:auto; }
  #log .entry{ display:flex; justify-content:space-between; gap:10px; padding:7px 10px; font-size:11px; border-bottom:1px solid var(--line); }
  #log .entry:last-child{ border-bottom:none; }
  #log .entry .txt{ color:#9db2c2; }
  #log .entry .cmd{ color:var(--eye); font-weight:700; }
  #log .entry.unmatched .cmd{ color:#4c5b68; }
  #log .empty{ text-align:center; color:#3a4650; font-size:11px; padding:12px; }

  /* ---- D-pad kontrol manual ---- */
  #dpad{
    position:fixed; left:16px; bottom:20px; z-index:30;
    display:none; grid-template-columns:48px 48px 48px; grid-template-rows:48px 48px 48px;
    gap:6px;
  }
  #dpad.show{ display:grid; }
  #dpad button{
    background:var(--panel); border:1px solid var(--line); color:var(--eye);
    font-size:18px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  #dpad button:active{ box-shadow:0 0 0 6px rgba(127,231,255,0.12); color:#fff; border-color:rgba(127,231,255,0.4); }
  #dpad button.stop{ color:var(--accent); }
  #dpad button.stop:active{ box-shadow:0 0 0 6px rgba(255,159,107,0.15); border-color:rgba(255,159,107,0.4); }
  #dpad .f{ grid-column:2; grid-row:1; }
  #dpad .l{ grid-column:1; grid-row:2; }
  #dpad .s{ grid-column:2; grid-row:2; }
  #dpad .r{ grid-column:3; grid-row:2; }
  #dpad .b{ grid-column:2; grid-row:3; }

  #banner{
    display:none; background:rgba(255,207,107,0.08); border:1px solid rgba(255,207,107,0.25);
    color:var(--warn); font-size:11px; padding:9px 11px; border-radius:10px; margin-bottom:12px; line-height:1.4;
  }
</style>
</head>
<body>

<div id="topbar">
  <div><span class="dot" id="btDot"></span>MOMO · <span id="btStatus">BT terputus</span></div>
  <div id="clock">--:--</div>
</div>

<div id="cmdBadge"></div>
<div id="hint">Tap layar = ganti ekspresi · Seret = mata mengikuti</div>

<div id="stage"><canvas id="face"></canvas></div>

<div id="controls">
  <button class="ctrlBtn mic" id="micBtn" title="Mikrofon">🎤</button>
  <button class="ctrlBtn bt" id="btBtn" title="Bluetooth">BT</button>
  <button class="ctrlBtn" id="manualBtn" title="Kontrol manual">🕹️</button>
  <button class="ctrlBtn" id="panelBtn" title="Detail">☰</button>
</div>

<div id="dpad">
  <button class="f" id="dpF" title="Maju">▲</button>
  <button class="l" id="dpL" title="Kiri">◀</button>
  <button class="s stop" id="dpS" title="Stop">■</button>
  <button class="r" id="dpR" title="Kanan">▶</button>
  <button class="b" id="dpB" title="Mundur">▼</button>
</div>

<div id="panel">
  <div id="panelHandle"></div>
  <div id="banner"></div>

  <label class="wake">
    <input type="checkbox" id="wakeToggle" checked>
    Butuh kata "MOMO" sebelum perintah dieksekusi
  </label>

  <div id="transcriptBox"><span class="placeholder">Ucapan Anda akan muncul di sini…</span></div>

  <h2 class="section">KATA KUNCI</h2>
  <div class="kwGrid" id="kwGrid"></div>

  <h2 class="section">RIWAYAT PERINTAH</h2>
  <div id="log"><div class="empty">Belum ada riwayat</div></div>
</div>

<script>
(function(){
  /* ======================================================
     BAGIAN 1 — WAJAH ANIMASI (canvas)
     ====================================================== */
  const canvas = document.getElementById('face');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const clockEl = document.getElementById('clock');
  function tickClock(){
    const d = new Date();
    clockEl.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  tickClock(); setInterval(tickClock, 15000);

  const EXPR = ['normal','senang','kaget','sedih','ngantuk','cinta'];
  let exprIndex = 0;
  let expr = EXPR[0];

  let lookX = 0, lookY = 0, lookTX = 0, lookTY = 0;
  let blink = 0;
  let nextBlinkAt = performance.now() + 1500 + Math.random()*2500;

  // reaksi sesaat akibat perintah suara (menimpa look/mood biasa)
  let reactUntil = 0, reactMood = null;
  let reactLook = { x:0, y:0 };

  let audioLevel = 0;
  let micActive = false;
  let audioCtx, analyser, dataArray, micStream;

  let dragging = false;
  function setLookFromPointer(x, y){
    const cx = W/2, cy = H/2;
    const maxR = Math.min(W,H) * 0.35;
    let dx = (x - cx) / maxR, dy = (y - cy) / maxR;
    const len = Math.hypot(dx,dy);
    if(len > 1){ dx/=len; dy/=len; }
    lookX = dx; lookY = dy;
  }
  canvas.addEventListener('pointerdown', (e)=>{ dragging = true; setLookFromPointer(e.clientX, e.clientY); });
  window.addEventListener('pointermove', (e)=>{ if(dragging) setLookFromPointer(e.clientX, e.clientY); });
  window.addEventListener('pointerup', ()=>{
    if(dragging){
      dragging = false;
      exprIndex = (exprIndex + 1) % EXPR.length;
      expr = EXPR[exprIndex];
      triggerBlink();
    }
  });

  function triggerBlink(){ blink = 0.001; }

  let idleTimer = 0;
  function updateIdleLook(dt){
    idleTimer -= dt;
    if(idleTimer <= 0 && !dragging){
      lookTX = (Math.random()*2-1) * 0.6;
      lookTY = (Math.random()*2-1) * 0.4;
      idleTimer = 1.2 + Math.random()*2.2;
    }
    if(!dragging){ lookX += (lookTX - lookX) * 0.06; lookY += (lookTY - lookY) * 0.06; }
  }

  function roundRect(x,y,w,h,r){
    r = Math.max(0, Math.min(r, Math.min(Math.abs(w),Math.abs(h))/2));
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawHeart(cx, cy, size){
    ctx.save(); ctx.translate(cx, cy); ctx.scale(size/40, size/40);
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.bezierCurveTo(0,-4, -20,-6, -20,10);
    ctx.bezierCurveTo(-20,22, 0,28, 0,34);
    ctx.bezierCurveTo(0,28, 20,22, 20,10);
    ctx.bezierCurveTo(20,-6, 0,-4, 0,10);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawEye(cx, cy, baseW, baseH, lx, ly, blinkAmt, mood, glowAlpha){
    ctx.save(); ctx.translate(cx, cy);
    let w = baseW, h = baseH, offsetY = 0, tilt = 0;
    if(mood === 'senang'){ h = baseH * (0.55 - blinkAmt*0.5); }
    else if(mood === 'kaget'){ w = baseW * 1.15; h = baseH * 1.25 * (1-blinkAmt); }
    else if(mood === 'sedih'){ h = baseH * (1-blinkAmt); tilt = (cx < 0 ? 1 : -1) * 0.15; }
    else if(mood === 'ngantuk'){ h = baseH * 0.35 * (1-blinkAmt*0.6); offsetY = baseH*0.15; }
    else if(mood === 'cinta'){ h = baseH*(1-blinkAmt); }
    else { h = baseH * (1-blinkAmt); }
    ctx.rotate(tilt);
    ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--eye-glow');
    ctx.shadowBlur = 28 * glowAlpha;
    const grad = ctx.createLinearGradient(0,-h/2,0,h/2);
    grad.addColorStop(0, '#bff5ff');
    grad.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--eye'));
    ctx.fillStyle = grad;
    const px = lx * w * 0.18, py = ly * h * 0.18 + offsetY;
    if(mood === 'cinta'){ drawHeart(px, py, Math.min(w,h)*0.9); }
    else { roundRect(px - w/2, py - h/2, w, h, Math.min(w,h)/2); ctx.fill(); }
    ctx.shadowBlur = 0; ctx.restore();
  }

  function drawMouth(cx, cy, mood, level){
    ctx.save(); ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(127,231,255,0.55)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const open = Math.min(1, level * 2.2);
    ctx.beginPath();
    if(mood === 'senang'){ ctx.arc(0, -10, 34, 0.15*Math.PI, 0.85*Math.PI); }
    else if(mood === 'sedih'){ ctx.arc(0, 22, 34, 1.15*Math.PI, 1.85*Math.PI); }
    else if(mood === 'kaget'){
      ctx.ellipse(0,0, 12+open*10, 14+open*16, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(127,231,255,0.35)'; ctx.fill(); ctx.restore(); return;
    } else {
      const w = 46;
      ctx.moveTo(-w/2, -open*10);
      ctx.quadraticCurveTo(0, open*22, w/2, -open*10);
    }
    ctx.stroke(); ctx.restore();
  }

  // ---- Reaksi wajah terhadap perintah gerak ----
  const REACT_MAP = {
    F: { x:0,    y:-0.7, mood:'senang',  duration:1200 },
    B: { x:0,    y:0.7,  mood:'normal',  duration:1200 },
    L: { x:-0.9, y:0,    mood:'normal',  duration:1200 },
    R: { x:0.9,  y:0,    mood:'normal',  duration:1200 },
    S: { x:0,    y:0,    mood:'ngantuk', duration:900  },
  };
  function reactFaceTo(code){
    const m = REACT_MAP[code]; if(!m) return;
    reactLook.x = m.x; reactLook.y = m.y; reactMood = m.mood;
    reactUntil = performance.now() + m.duration;
    triggerBlink();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last)/1000); last = now;

    updateAudioLevel();

    if(now >= nextBlinkAt && blink <= 0) blink = 0.001;
    let blinkAmt = 0;
    if(blink > 0){
      blinkAmt = Math.sin(Math.min(1,blink) * Math.PI);
      blink += dt * 6;
      if(blink > 1.6){ blink = 0; nextBlinkAt = now + 1800 + Math.random()*3000; }
    }

    const reacting = now < reactUntil;
    if(reacting){
      lookX += (reactLook.x - lookX) * 0.25;
      lookY += (reactLook.y - lookY) * 0.25;
    } else {
      updateIdleLook(dt);
    }
    const moodForDraw = reacting ? reactMood : expr;

    ctx.clearRect(0,0,W,H);
    const cx = W/2, cy = H/2 - H*0.03;
    const eyeGap = Math.min(W,H) * 0.30;
    const eyeW = Math.min(W,H) * 0.22;
    const eyeH = Math.min(W,H) * 0.26;
    const glow = 0.6 + audioLevel*0.6;

    drawEye(cx - eyeGap, cy, eyeW, eyeH, lookX, lookY, blinkAmt, moodForDraw, glow);
    drawEye(cx + eyeGap, cy, eyeW, eyeH, lookX, lookY, blinkAmt, moodForDraw, glow);
    drawMouth(cx, cy + eyeH*0.95, moodForDraw, audioLevel);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ======================================================
     BAGIAN 2 — MIKROFON: level suara (mulut) + Speech-to-Text (perintah)
     ====================================================== */
  const micBtn = document.getElementById('micBtn');
  const wakeToggle = document.getElementById('wakeToggle');
  const transcriptBox = document.getElementById('transcriptBox');
  const banner = document.getElementById('banner');
  const cmdBadge = document.getElementById('cmdBadge');
  const logEl = document.getElementById('log');

  function showBanner(msg){ banner.textContent = msg; banner.style.display = 'block'; }

  const COMMANDS = [
    { code:'F', label:'Maju',   desc:'Bergerak ke depan',  words:['maju','ke depan','depan','jalan'] },
    { code:'B', label:'Mundur', desc:'Bergerak ke belakang', words:['mundur','balik','ke belakang','belakang'] },
    { code:'L', label:'Kiri',   desc:'Belok kiri', words:['kiri','belok kiri','ke kiri'] },
    { code:'R', label:'Kanan',  desc:'Belok kanan', words:['kanan','belok kanan','ke kanan'] },
    { code:'S', label:'Stop',   desc:'Berhenti', words:['stop','berhenti','diam','tahan'] },
  ];
  const WAKE_WORDS = ['momo'];

  const kwGrid = document.getElementById('kwGrid');
  COMMANDS.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'kwCard';
    div.innerHTML = `<div class="k">${c.label} (<b>${c.code}</b>)</div><div class="v">${c.words.join(' · ')}</div>`;
    kwGrid.appendChild(div);
  });

  function matchCommand(text){
    const t = text.toLowerCase();
    for(const c of COMMANDS){ for(const w of c.words){ if(t.includes(w)) return c; } }
    return null;
  }
  function addLogEntry(text, cmd, note){
    if(logEl.querySelector('.empty')) logEl.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'entry' + (cmd ? '' : ' unmatched');
    const time = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const codeLabel = cmd ? cmd.code : '—';
    row.innerHTML = `<span class="txt">${time} · "${text}"${note ? ' <i>('+note+')</i>' : ''}</span><span class="cmd">${codeLabel}</span>`;
    logEl.prepend(row);
  }
  let badgeTimer = null;
  function flashBadge(text, warn){
    cmdBadge.textContent = text;
    cmdBadge.classList.toggle('warn', !!warn);
    cmdBadge.classList.add('show');
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(()=> cmdBadge.classList.remove('show'), 1600);
  }

  // ---- Level suara (untuk animasi mulut) via getUserMedia + AnalyserNode ----
  async function startAudioLevel(){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      src.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    } catch(err){
      // tidak fatal — mulut cukup diam kalau ini gagal, speech recognition tetap jalan
    }
  }
  function stopAudioLevel(){
    if(micStream) micStream.getTracks().forEach(t=>t.stop());
    audioLevel = 0; analyser = null;
  }
  function updateAudioLevel(){
    if(!micActive || !analyser) return;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0; for(let i=0;i<dataArray.length;i++) sum += dataArray[i];
    const avg = sum / dataArray.length;
    audioLevel += ((avg/255) - audioLevel) * 0.35;
  }

  // ---- Speech-to-Text (untuk perintah) ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null, shouldListen = false;

  if(!SpeechRecognition){
    showBanner('Browser ini tidak mendukung Speech-to-Text. Gunakan Chrome di Android.');
    micBtn.disabled = true;
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'id-ID';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (e)=>{
      let finalText = '', interimText = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        if(res.isFinal) finalText += res[0].transcript; else interimText += res[0].transcript;
      }
      transcriptBox.innerHTML = (finalText || interimText) || '<span class="placeholder">Mendengarkan…</span>';
      if(finalText.trim()) handleFinalTranscript(finalText.trim());
    };
    recognition.onerror = (e)=>{
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        showBanner('Izin mikrofon ditolak. Aktifkan izin mikrofon untuk situs ini.');
        shouldListen = false; setMicUI(false);
      } else if(e.error === 'no-speech'){
        // wajar terjadi saat diam, onend akan restart otomatis — tidak perlu banner
      } else if(e.error === 'audio-capture'){
        showBanner('Mikrofon tidak terdeteksi (audio-capture). Cek perangkat mic Anda.');
        shouldListen = false; setMicUI(false);
      } else if(e.error === 'network'){
        showBanner('Speech recognition butuh koneksi internet aktif (error: network).');
      } else if(e.error === 'language-not-supported'){
        showBanner('Bahasa id-ID tidak didukung perangkat ini untuk Speech-to-Text.');
        shouldListen = false; setMicUI(false);
      } else {
        showBanner('Speech recognition error: ' + e.error);
      }
    };
    recognition.onend = ()=>{
      if(shouldListen){
        try{ recognition.start(); }
        catch(err){
          showBanner('Speech recognition berhenti dan gagal restart (' + err.message + '). Tekan tombol mic lagi.');
          shouldListen = false; setMicUI(false);
        }
      } else setMicUI(false);
    };
  }

  function setMicUI(on){ micBtn.classList.toggle('on', on); micActive = on; }

  micBtn.addEventListener('click', async ()=>{
    if(!recognition) return;
    if(!shouldListen){
      shouldListen = true;
      try{ recognition.start(); }catch(err){}
      await startAudioLevel();
      setMicUI(true);
    } else {
      shouldListen = false;
      recognition.stop();
      stopAudioLevel();
      setMicUI(false);
    }
  });

  function handleFinalTranscript(text){
    const lower = text.toLowerCase();
    if(wakeToggle.checked && !WAKE_WORDS.some(w => lower.includes(w))){
      // Perintah mungkin benar, tapi kata wajib "MOMO" belum diucapkan — beri tahu, jangan diam saja
      const maybe = matchCommand(text);
      if(maybe){ flashBadge('Ucapkan "MOMO" dulu', true); addLogEntry(text, null, 'butuh kata MOMO'); }
      else addLogEntry(text, null);
      return;
    }
    const c = matchCommand(text);
    if(c){
      reactFaceTo(c.code);
      const sent = sendCommand(c.code);
      flashBadge(c.label + ' (' + c.code + ')' + (sent ? '' : ' · tidak terkirim'), !sent);
      addLogEntry(text, c, sent ? null : 'BT belum tersambung');
    } else {
      addLogEntry(text, null);
    }
  }

  /* ======================================================
     BAGIAN 3 — BLUETOOTH (BLE UART) ke ESP32
     ====================================================== */
  const UART_SERVICE = '6e400001-b5a3-f393-e9a0-e50e24dcca9e';
  const UART_RX_CHAR  = '6e400002-b5a3-f393-e9a0-e50e24dcca9e';

  let btDevice = null, btChar = null;
  const btBtn = document.getElementById('btBtn');
  const btDot = document.getElementById('btDot');
  const btStatus = document.getElementById('btStatus');

  if(!navigator.bluetooth){
    showBanner((banner.textContent ? banner.textContent + ' ' : '') + 'Web Bluetooth tidak tersedia (iOS Safari belum mendukung). Gunakan Chrome Android.');
    btBtn.disabled = true;
  }

  btBtn.addEventListener('click', async ()=>{
    if(btChar){ try{ btDevice.gatt.disconnect(); }catch(e){} onBtDisconnected(); return; }
    try{
      btDevice = await navigator.bluetooth.requestDevice({
        filters: [{ services: [UART_SERVICE] }], optionalServices: [UART_SERVICE]
      });
      btDevice.addEventListener('gattserverdisconnected', onBtDisconnected);
      const server = await btDevice.gatt.connect();
      const service = await server.getPrimaryService(UART_SERVICE);
      btChar = await service.getCharacteristic(UART_RX_CHAR);
      btBtn.classList.add('on'); btDot.classList.add('bt-on'); btStatus.textContent = 'BT tersambung';
    } catch(err){ showBanner('Gagal menyambung Bluetooth: ' + err.message); }
  });
  function onBtDisconnected(){
    btChar = null; btBtn.classList.remove('on'); btDot.classList.remove('bt-on'); btStatus.textContent = 'BT terputus';
  }
  function sendCommand(code){
    if(!btChar){
      showBanner('BT belum tersambung — perintah suara dikenali tapi tidak dikirim ke robot. Tekan tombol BT dulu.');
      return false;
    }
    btChar.writeValue(new TextEncoder().encode(code))
      .catch(err => showBanner('Gagal mengirim perintah: ' + err.message));
    return true;
  }

  /* ======================================================
     BAGIAN 3.5 — KONTROL MANUAL (D-pad sentuh)
     ====================================================== */
  const manualBtn = document.getElementById('manualBtn');
  const dpad = document.getElementById('dpad');
  manualBtn.addEventListener('click', ()=>{
    dpad.classList.toggle('show');
    manualBtn.classList.toggle('on', dpad.classList.contains('show'));
  });

  function sendManualCommand(code){
    const c = COMMANDS.find(cmd => cmd.code === code);
    reactFaceTo(code);
    const sent = sendCommand(code);
    if(c){
      flashBadge(c.label + ' (' + c.code + ')' + (sent ? '' : ' · tidak terkirim'), !sent);
      addLogEntry(c.label + ' (manual)', c, sent ? 'manual' : 'BT belum tersambung');
    }
  }

  [['dpF','F'],['dpB','B'],['dpL','L'],['dpR','R'],['dpS','S']].forEach(([id, code])=>{
    document.getElementById(id).addEventListener('click', ()=> sendManualCommand(code));
  });

  /* ======================================================
     BAGIAN 4 — Panel geser (transkrip/riwayat/kata kunci)
     ====================================================== */
  const panel = document.getElementById('panel');
  const panelBtn = document.getElementById('panelBtn');
  panelBtn.addEventListener('click', ()=> panel.classList.toggle('open'));
})();
</script>
</body>
</html>
